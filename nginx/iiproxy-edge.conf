# Вход от Traefik → реальный бэкенд iiproxy-web:8000.
# Заглушку при недоступном приложении делает nginx (error_page), а не Traefik errors-middleware —
# последний не срабатывает при «connection refused» к контейнеру.
server {
    listen 80;
    listen [::]:80;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server_name _;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/html text/plain text/css application/javascript application/json text/xml application/xml image/svg+xml;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    client_max_body_size 50m;

    location /api/ {
        gzip off;
        proxy_buffering off;
        proxy_cache off;
        proxy_intercept_errors off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        set $iiproxy_upstream iiproxy-web:8000;
        proxy_pass http://$iiproxy_upstream;
    }

    # OpenAI-совместимые маршруты (prefix /v1, не под /api/)
    location ^~ /v1 {
        gzip off;
        proxy_buffering off;
        proxy_cache off;
        proxy_intercept_errors off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        set $iiproxy_upstream iiproxy-web:8000;
        proxy_pass http://$iiproxy_upstream;
    }

    location / {
        proxy_intercept_errors on;
        error_page 502 503 504 /maint-fallback.html;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;

        set $iiproxy_upstream iiproxy-web:8000;
        proxy_pass http://$iiproxy_upstream;
    }

    location = /maint-fallback.html {
        internal;
        alias /usr/share/nginx/maintenance/index.html;
        add_header Cache-Control "no-store" always;
        types { }
        default_type text/html;
        charset utf-8;
    }
}
