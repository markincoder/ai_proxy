<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Вход — AI Proxy</title>
    <link rel="stylesheet" href="/static/css/style.css?v=5" />
  </head>
  <body>
    <header class="top-nav" role="navigation" aria-label="Главное меню">
      <a href="/" class="brand">
        <span class="brand-mark" aria-hidden="true">AI</span>
        <span>AI Proxy</span>
      </a>
      <nav class="nav-links">
        <a href="/" class="nav-link">Новый чат</a>
        <a href="/tariffs" class="nav-link">Все модели</a>
      </nav>
      <div class="nav-actions">
        <span class="balance-pill" style="opacity: 0.7">Вход</span>
      </div>
    </header>

    <div class="login-wrap">
      <p id="oauth-err" style="color: #b91c1c; font-size: 0.85rem; margin-bottom: 0.75rem; text-align: center; display: none"></p>

      <div class="login-box" id="box-oauth" style="display: none">
        <p style="margin: 0 0 0.75rem; color: var(--muted); font-size: 0.9rem">Войти через аккаунт</p>
        <div style="display: flex; flex-direction: column; gap: 0.5rem">
          <a class="btn btn-primary" id="link-yandex" href="#" style="text-align: center; text-decoration: none"
            >Яндекс ID</a
          >
          <a class="btn" id="link-vk" href="#" style="text-align: center; text-decoration: none">VK ID</a>
        </div>
      </div>

      <p id="no-oauth-msg" style="display: none; text-align: center; color: var(--muted); margin: 1rem 0; font-size: 0.9rem; max-width: 24rem; margin-left: auto; margin-right: auto">
        Вход только через Яндекс или VK. Задайте в <code>.env</code> переменные <code>YANDEX_OAUTH_*</code> и/или <code>VK_OAUTH_*</code> и перезапустите сервер.
      </p>
    </div>

    <script>
      const api = (p, o = {}) => {
        const { headers: h, ...rest } = o;
        return fetch(p, {
          credentials: "include",
          ...rest,
          headers: { "ngrok-skip-browser-warning": "2048", ...(h || {}) },
        });
      };

      const oauthErrors = {
        yandex_denied: "Вход через Яндекс отменён.",
        yandex_state: "Сессия устарела. Попробуйте войти через Яндекс снова.",
        yandex_token: "Не удалось получить токен Яндекса.",
        yandex_profile: "Не удалось прочитать профиль Яндекса.",
        vk_denied: "Вход через VK отменён.",
        vk_state: "Сессия устарела. Попробуйте войти через VK снова.",
        vk_token: "Не удалось обменять код VK на токен.",
      };

      async function init() {
        const qp = new URLSearchParams(window.location.search);
        const oe = qp.get("oauth_error");
        if (oe) {
          const el = document.getElementById("oauth-err");
          el.style.display = "block";
          el.textContent = oauthErrors[oe] || "Ошибка входа через соцсеть. Проверьте настройки OAuth в кабинете провайдера.";
          const u = new URL(window.location.href);
          u.searchParams.delete("oauth_error");
          const qs = u.searchParams.toString();
          history.replaceState({}, "", u.pathname + (qs ? `?${qs}` : "") + u.hash);
        }

        let oauthYandex = false;
        let oauthVk = false;
        if (window.__LOGIN_BOOT__) {
          oauthYandex = !!window.__LOGIN_BOOT__.oauthYandex;
          oauthVk = !!window.__LOGIN_BOOT__.oauthVk;
        } else {
          try {
            const r = await api("/api/config");
            if (r.ok) {
              const cfg = await r.json();
              oauthYandex = cfg.oauthYandex === true;
              oauthVk = cfg.oauthVk === true;
            }
          } catch {
            /* ignore */
          }
        }

        const hasOAuth = oauthYandex || oauthVk;
        if (hasOAuth) {
          document.getElementById("box-oauth").style.display = "block";
          if (oauthYandex) {
            document.getElementById("link-yandex").href = "/api/auth/oauth/yandex/start";
          } else {
            document.getElementById("link-yandex").style.display = "none";
          }
          if (oauthVk) {
            document.getElementById("link-vk").href = "/api/auth/oauth/vk/start";
          } else {
            document.getElementById("link-vk").style.display = "none";
          }
        } else {
          document.getElementById("no-oauth-msg").style.display = "block";
        }
      }

      init();
    </script>
  </body>
</html>
