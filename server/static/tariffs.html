<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Модели и тарифы — II Proxy</title>
    <link rel="stylesheet" href="/static/css/style.css?v=72" />
  </head>
  <body class="page-tariffs">
    <div id="site-banner-slot" aria-live="polite"></div>
    <script src="/static/js/site-banner.js?v=2" defer></script>
    <div id="site-header-root"></div>
    <script src="/static/js/site-header.js?v=8" defer></script>

    <main class="main-shell layout-wide page-tariffs-main">
      <h1 class="page-title">Все модели и тарифы</h1>

      <aside class="tariffs-promo" aria-label="Пояснения по тарификации">
        <p class="tariffs-promo__text">
          <strong>Про токены:</strong> в текстовых моделях цены — за <strong>1 млн токенов</strong> (вход и выход вместе).
          Простой ориентир для <strong>русского</strong> текста: <strong>1 млн токенов ≈ 300–500 тыс. слов</strong> (зависит от
          текста; для картинок, видео и аудио смотрите единицы в карточке модели).
        </p>
      </aside>

      <div class="tariffs-filter-row">
        <label for="tariffs-filter" class="tariffs-filter-label">Поиск по названию</label>
        <input
          type="search"
          id="tariffs-filter"
          placeholder="Название модели или провайдер…"
          autocomplete="off"
        />
      </div>

      <div class="tariffs-tabs" role="tablist" aria-label="Категории моделей" id="tariffs-tablist"></div>
      <div id="tariffs-panels"></div>
    </main>

    <footer class="site-footer">II Proxy</footer>

    <script>
      /** Как в chat.js — текущая модель в чате (sessionStorage). */
      const MODEL_SS_KEY = "ai_proxy_model_slug";
      const EXPLICIT_MODEL_SS_KEY = "ai_proxy_explicit_model";

      const MODEL_GROUPS = [
        { id: "free", emoji: "🎁", title: "Бесплатные" },
        { id: "text", emoji: "💬", title: "Текст и чат" },
        { id: "image", emoji: "🖼", title: "Изображения в чате" },
        { id: "video", emoji: "🎬", title: "Видео" },
        { id: "transcription", emoji: "📝", title: "Транскрипция" },
        { id: "speech", emoji: "🎙️", title: "Речь в чате" },
        { id: "music", emoji: "🎵", title: "Музыка" },
        { id: "embeddings", emoji: "🔗", title: "Эмбеддинги" },
      ];

      function isSttOnlyTariffModel(m) {
        return (
          m.supportsTranscription === true &&
          m.supportsSpeech !== true &&
          m.supportsMusicGeneration !== true &&
          m.supportsImageGeneration !== true &&
          m.supportsVideoGeneration !== true
        );
      }

      function modelGroupIds(m) {
        if (m.supportsEmbeddings === true && m.supportsChat === false) return ["embeddings"];
        const seen = new Set();
        const out = [];
        /** @param {string} id */
        function push(id) {
          if (!seen.has(id)) {
            seen.add(id);
            out.push(id);
          }
        }
        if (m.isFree === true) push("free");
        if (m.supportsVideoGeneration === true) push("video");
        if (m.supportsImageGeneration === true) push("image");
        if (m.supportsSpeech === true) push("speech");
        if (m.supportsTranscription === true) push("transcription");
        if (m.supportsMusicGeneration === true) push("music");

        const textOk = m.supportsChat !== false && !isSttOnlyTariffModel(m);
        if (textOk) push("text");

        if (out.length === 0) push("text");
        return out;
      }

      function primaryModelTabId(m) {
        const ids = modelGroupIds(m);
        const order = [
          "embeddings",
          "free",
          "video",
          "image",
          "speech",
          "transcription",
          "music",
          "text",
        ];
        for (const id of order) {
          if (ids.includes(id)) return id;
        }
        return "text";
      }

      /** Для вкладки «Все»: перечень разделов, где есть модель. */
      function categoryTitlesJoined(m) {
        const ids = modelGroupIds(m);
        const titles = MODEL_GROUPS.filter((x) => ids.includes(x.id)).map((x) => x.title);
        return titles.length ? titles.join(" · ") : primaryModelTabId(m);
      }

      function modelProducesChatAudio(m) {
        const s = String(m.slug || "").toLowerCase();
        if (s.includes("lyria")) return true;
        return m.supportsSpeech === true && m.supportsMusicGeneration === true;
      }

      function billingBadge(m) {
        const c = m.capabilities || {};
        if (c.free) return "Бесплатно";
        if (c.videoGeneration) return "Видео (сек., разреш., звук)";
        if (c.imageGeneration) return "Картинка в чате (токены)";
        if (c.speech) return "Речь / аудио в чате";
        if (c.transcription) return "Транскрипция (отдельный API)";
        if (c.embeddings === true && c.chat === false) return "Эмбеддинги (отдельный API)";
        if (c.musicGeneration) return "Музыка";
        return "Текст (токены)";
      }

      function renderPricingBlock(m) {
        let html = "";
        if (m.pricingNoteRu) {
          html += `<div class="tariff-pricing-note" role="note">${escape(m.pricingNoteRu)}</div>`;
        }
        if (m.isFree) {
          html +=
            '<p class="tariff-price-line"><strong>0 ₽</strong> — бесплатный канал (ограничения и очереди на стороне сервиса).</p>';
          return html;
        }

        if (m.supportsEmbeddings === true && m.supportsChat === false) {
          html +=
            '<p class="tariff-price-line">Вход текста для вектора: <strong>' +
            fmt(m.inputPricePerMn) +
            ' ₽</strong> за 1 млн токенов (ориентир; фактическое списание — по <code>usage</code> от провайдера).</p>';
          html +=
            '<p class="tariff-price-hint">Не для чата. API: <code>POST /api/v1/embeddings</code> или <code>POST /v1/embeddings</code> с ключом <code>iip_…</code>.</p>';
          return html;
        }

        /* Только STT: число во входном поле — ориентир ₽ за минуту входного аудио. */
        if (
          m.supportsTranscription &&
          !m.capabilities?.videoGeneration &&
          !m.capabilities?.imageGeneration &&
          !m.supportsSpeech
        ) {
          html +=
            '<p class="tariff-price-line">Ориентир: <strong>' +
            fmt(m.inputPricePerMn) +
            " ₽</strong> за минуту входного аудио (распознавание).</p>";
          html +=
            '<p class="tariff-price-hint">Тариф задаёт провайдер; это не текстовые токены completions.</p>';
          return html;
        }

        /* Видео: секунды готового ролика; число входа — ориентир ₽/с, не ₽ за 1M чат-токенов. */
        if (m.capabilities?.videoGeneration) {
          const rubPerSec = Number(m.inputPricePerMn);
          if (rubPerSec > 0) {
            html +=
              '<p class="tariff-price-line">Ориентир: <strong>' +
              fmt(rubPerSec) +
              " ₽</strong> за одну секунду длительности готового ролика.</p>";
          } else {
            html +=
              '<p class="tariff-price-line">Стоимость — по факту после генерации: за длительность готового ролика по ставке провайдера (ориентир ₽/с появится в таблице, когда тариф подтянут на сервер).</p>';
          }
          html +=
            '<p class="tariff-price-hint">Итоговая сумма на балансе — после завершения генерации; разрешение и звук влияют на цену за секунду.</p>';
          return html;
        }

        html += `
          <ul class="tariff-token-prices">
            <li>Вход: ${fmt(m.inputPricePerMn)} ₽ / 1M токенов</li>
            <li>Выход: ${fmt(m.outputPricePerMn)} ₽ / 1M токенов</li>
            ${m.fixedPrice != null ? `<li>Фикс (редко для чата): ${fmt(m.fixedPrice)} ₽</li>` : ""}
          </ul>
        `;
        if (
          m.capabilities?.imageGeneration &&
          !m.pricingNoteRu
        ) {
          html +=
            '<p class="tariff-price-hint">Картинка в ответе увеличивает выходные токены по сравнению с чистым текстом.</p>';
        } else if (
          !m.pricingNoteRu &&
          !m.capabilities?.imageGeneration &&
          !m.capabilities?.musicGeneration &&
          !m.capabilities?.speech &&
          !m.capabilities?.transcription
        ) {
          html +=
            '<p class="tariff-price-hint">В текстовом чате списание по фактическому количеству токенов.</p>';
        }
        if (m.capabilities?.transcription && !m.isFree) {
          html +=
            '<p class="tariff-price-hint">Транскрипция — отдельный режим; тариф за аудио задаёт провайдер.</p>';
        }
        return html;
      }

      function escape(s) {
        const d = document.createElement("div");
        d.textContent = s == null ? "" : String(s);
        return d.innerHTML;
      }

      function fmt(x) {
        return Number(x).toLocaleString("ru-RU", { maximumFractionDigits: 4 });
      }

      function modelCardHtml(m, showCategory) {
        const embedOnly = m.supportsEmbeddings === true && m.supportsChat === false;
        const chatHref = `/?model=${encodeURIComponent(m.slug)}`;
        const sttOnly =
          m.capabilities?.transcription &&
          !m.capabilities?.speech &&
          !m.capabilities?.musicGeneration &&
          !m.capabilities?.imageGeneration &&
          !m.capabilities?.videoGeneration;
        const metaLine = showCategory
          ? `${escape(m.provider)} · <span class="tariff-card-cat">${escape(categoryTitlesJoined(m))}</span> · <code>${escape(m.slug)}</code>`
          : `${escape(m.provider)} · <code>${escape(m.slug)}</code>`;
        const chatFooter = embedOnly
          ? `<p class="tariff-price-hint">Только эмбеддинги: <code>POST /api/v1/embeddings</code> или IDE с base URL …<code>/v1</code> и <code>POST /v1/embeddings</code>; ключ как для чата.</p>`
          : `<a class="btn btn-primary tariff-open-chat" href="${chatHref}" data-model-id="${escape(m.slug)}">Выбрать в чате</a>` +
            (sttOnly
              ? `<p class="tariff-price-hint">Только распознавание: во вкладке «Транскрипция» — микрофон или аудио 📎. Диалог — другие модели; API: <code>POST /api/v1/transcribe</code>.</p>`
              : "");
        return `
                <div class="tariff-card-head">
                  <h3 class="tariff-card-title">${escape(m.displayName)}</h3>
                  <span class="tariff-billing-badge">${escape(billingBadge(m))}</span>
                </div>
                <div class="tariff-meta">${metaLine}</div>
                ${
                  m.descriptionRu
                    ? `<p class="tariff-desc">${escape(m.descriptionRu)}</p>`
                    : ""
                }
                ${renderPricingBlock(m)}
                ${chatFooter}
              `;
      }

      function appendModelToGrid(grid, m, showCategory) {
        const art = document.createElement("article");
        art.className = "card tariff-card";
        const slug = m.slug != null ? String(m.slug) : "";
        const slugWords = slug.replace(/[/\-_:]/g, " ");
        const ft = [m.displayName, slug, slugWords, m.provider, categoryTitlesJoined(m)]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();
        art.setAttribute("data-filter-text", ft);
        if (slug) art.setAttribute("data-model-slug", slug);
        art.innerHTML = modelCardHtml(m, showCategory);
        grid.appendChild(art);
      }

      fetch("/api/models")
        .then((r) => r.json())
        .then((models) => {
          const buckets = { free: [], text: [], embeddings: [], image: [], video: [], transcription: [], speech: [], music: [] };
          for (const m of models) {
            for (const gid of modelGroupIds(m)) {
              if (Object.prototype.hasOwnProperty.call(buckets, gid)) buckets[gid].push(m);
            }
          }
          for (const k of Object.keys(buckets)) {
            buckets[k].sort((a, b) =>
              String(a.displayName).localeCompare(String(b.displayName), "ru"),
            );
          }

          const allSorted = [...models].sort((a, b) =>
            String(a.displayName).localeCompare(String(b.displayName), "ru"),
          );

          const tabGroups = [];
          if (models.length > 0) {
            tabGroups.push({ id: "all", emoji: "📋", title: "Все" });
          }
          for (const g of MODEL_GROUPS) {
            if (buckets[g.id].length > 0) tabGroups.push(g);
          }

          const tablist = document.getElementById("tariffs-tablist");
          const panelsRoot = document.getElementById("tariffs-panels");
          tablist.innerHTML = "";
          panelsRoot.innerHTML = "";

          if (tabGroups.length === 0) {
            panelsRoot.innerHTML =
              '<p class="hint" style="margin:0">Нет моделей в каталоге.</p>';
            return;
          }

          tabGroups.forEach((g, i) => {
            const tab = document.createElement("button");
            tab.type = "button";
            tab.className = "tariffs-tab" + (i === 0 ? " tariffs-tab--active" : "");
            tab.setAttribute("role", "tab");
            tab.setAttribute("aria-selected", i === 0 ? "true" : "false");
            tab.setAttribute("aria-controls", `tariff-panel-${g.id}`);
            tab.id = `tariff-tab-${g.id}`;
            tab.dataset.group = g.id;
            tab.innerHTML =
              `<span class="model-tab-icon-wrap model-tab-icon-wrap--emoji" aria-hidden="true">${g.emoji}</span>` +
              `<span>${escape(g.title)}</span>`;
            tablist.appendChild(tab);

            const panel = document.createElement("div");
            panel.className = "tariffs-panel";
            panel.id = `tariff-panel-${g.id}`;
            panel.setAttribute("role", "tabpanel");
            panel.setAttribute("aria-labelledby", `tariff-tab-${g.id}`);
            panel.hidden = i !== 0;
            panel.dataset.group = g.id;

            if (g.id === "transcription") {
              const note = document.createElement("p");
              note.className = "hint";
              note.style.margin = "0 0 1rem";
              note.innerHTML =
                "Эти модели <strong>не для диалога</strong> — только распознавание в текст. В <a href=\"/\">чате</a> выберите " +
                "вкладку «Транскрипция» и модель, затем микрофон (удерживайте) или аудио во вложении 📎.";
              panel.appendChild(note);
            }

            if (g.id === "embeddings") {
              const note = document.createElement("p");
              note.className = "hint";
              note.style.margin = "0 0 1rem";
              note.innerHTML =
                "Векторизация текста для поиска и RAG. Запросы — <code>POST /api/v1/embeddings</code> или <code>POST /v1/embeddings</code> " +
                "с тем же ключом <code>iip_…</code>, что и для чата; в чате эти модели не выбираются.";
              panel.appendChild(note);
            }

            const showCat = g.id === "all";
            const modelList = g.id === "all" ? allSorted : buckets[g.id];

            if (g.id === "music") {
              const audioMs = modelList.filter((m) => modelProducesChatAudio(m));
              const textMs = modelList.filter((m) => !modelProducesChatAudio(m));
              function addMusicSubsection(title, models) {
                if (models.length === 0) return;
                const lab = document.createElement("p");
                lab.className = "tariffs-subsection-label";
                lab.textContent = title;
                panel.appendChild(lab);
                const subGrid = document.createElement("div");
                subGrid.className = "tariffs-grid";
                for (const m of models) {
                  appendModelToGrid(subGrid, m, showCat);
                }
                panel.appendChild(subGrid);
              }
              addMusicSubsection("Генерация аудио", audioMs);
              addMusicSubsection("Только текст (без готового звука)", textMs);
            } else if (g.id === "speech") {
              const audioOutMs = modelList.filter((m) => modelProducesChatAudio(m));
              const speechInTextOutMs = modelList.filter((m) => !modelProducesChatAudio(m));
              function addSpeechSubsection(title, models) {
                if (models.length === 0) return;
                const lab = document.createElement("p");
                lab.className = "tariffs-subsection-label";
                lab.textContent = title;
                panel.appendChild(lab);
                const subGrid = document.createElement("div");
                subGrid.className = "tariffs-grid";
                for (const m of models) {
                  appendModelToGrid(subGrid, m, showCat);
                }
                panel.appendChild(subGrid);
              }
              addSpeechSubsection("Распознавание и ответ со звуком в чате", audioOutMs);
              addSpeechSubsection("Речь на входе, ответ текстом", speechInTextOutMs);
            } else {
              const grid = document.createElement("div");
              grid.className = "tariffs-grid";
              for (const m of modelList) {
                appendModelToGrid(grid, m, showCat);
              }
              panel.appendChild(grid);
            }
            panelsRoot.appendChild(panel);
          });

          const filterInput = document.getElementById("tariffs-filter");
          function applyTariffsFilter() {
            const raw = (filterInput && filterInput.value ? filterInput.value : "").trim().toLowerCase();
            const tokens = raw.split(/\s+/).filter(Boolean);
            panelsRoot.querySelectorAll("article.tariff-card").forEach((art) => {
              const hay = (art.getAttribute("data-filter-text") || "").toLowerCase();
              const hide = tokens.length > 0 && !tokens.every((t) => hay.includes(t));
              art.hidden = hide;
              art.classList.toggle("tariff-card--hidden", hide);
            });
          }
          if (filterInput) {
            filterInput.addEventListener("input", applyTariffsFilter);
            filterInput.addEventListener("search", applyTariffsFilter);
          }
          /* Если текст введён до прихода списка, применить фильтр после отрисовки карточек */
          applyTariffsFilter();

          function activateTab(gid) {
            tablist.querySelectorAll(".tariffs-tab").forEach((t) => {
              const on = t.dataset.group === gid;
              t.classList.toggle("tariffs-tab--active", on);
              t.setAttribute("aria-selected", on ? "true" : "false");
            });
            panelsRoot.querySelectorAll(".tariffs-panel").forEach((p) => {
              p.hidden = p.dataset.group !== gid;
            });
          }

          tablist.addEventListener("click", (e) => {
            const btn = e.target.closest(".tariffs-tab");
            if (!btn || !tablist.contains(btn)) return;
            const gid = btn.dataset.group;
            if (gid) activateTab(gid);
          });

          function rememberModelChoice(modelId) {
            if (!modelId) return;
            try {
              sessionStorage.setItem(MODEL_SS_KEY, modelId);
              sessionStorage.setItem(EXPLICIT_MODEL_SS_KEY, "1");
            } catch {
              /* ignore */
            }
          }
          panelsRoot.addEventListener("click", (e) => {
            const a = e.target.closest("a.tariff-open-chat");
            if (a && panelsRoot.contains(a)) {
              const id = a.dataset.modelId;
              rememberModelChoice(id);
            }
          });

          function cssEsc(s) {
            return typeof CSS !== "undefined" && typeof CSS.escape === "function"
              ? CSS.escape(String(s))
              : String(s).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
          }

          /** Вернуться с / : выбрать вкладку с моделью из чата, подсветить карточку, прокрутить и фокус. */
          function focusStoredChatModelOnTariffs() {
            let slug = "";
            try {
              slug = (sessionStorage.getItem(MODEL_SS_KEY) || "").trim();
            } catch {
              return;
            }
            if (!slug) return;
            const model = models.find((x) => String(x.slug) === slug);
            if (!model) return;

            if (filterInput && filterInput.value.trim()) {
              filterInput.value = "";
              applyTariffsFilter();
            }

            const tabId = primaryModelTabId(model);
            const tryPanel = (gid) => {
              const panel = panelsRoot.querySelector(`.tariffs-panel[data-group="${cssEsc(gid)}"]`);
              if (!panel) return null;
              const art = panel.querySelector(`article.tariff-card[data-model-slug="${cssEsc(slug)}"]`);
              if (!art || art.hasAttribute("hidden") || art.classList.contains("tariff-card--hidden"))
                return null;
              return art;
            };

            let card = tryPanel(tabId);
            if (!card && tabGroups.some((g) => g.id === "all")) {
              card = tryPanel("all");
            }
            if (!card) {
              for (const g of tabGroups) {
                card = tryPanel(g.id);
                if (card) break;
              }
            }
            if (!card) return;

            const gidForCard = card.closest(".tariffs-panel")?.dataset?.group;
            if (gidForCard) activateTab(gidForCard);

            panelsRoot.querySelectorAll("article.tariff-card.tariff-card--chat-selected").forEach((el) => {
              el.classList.remove("tariff-card--chat-selected");
            });
            card.classList.add("tariff-card--chat-selected");

            const focusLink = card.querySelector("a.tariff-open-chat");
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                try {
                  card.scrollIntoView({ behavior: "smooth", block: "center" });
                } catch {
                  card.scrollIntoView();
                }
                try {
                  if (focusLink) {
                    focusLink.focus({ preventScroll: true });
                  } else {
                    card.setAttribute("tabindex", "-1");
                    card.focus({ preventScroll: true });
                  }
                } catch {
                  /* ignore */
                }
              });
            });
          }

          focusStoredChatModelOnTariffs();
        })
        .catch((e) => {
          console.error(e);
          document.getElementById("tariffs-panels").innerHTML =
            '<p class="err" style="display:block">Не удалось загрузить модели.</p>';
        });
    </script>
    <script src="/static/js/app-nav.js?v=4" defer></script>
  </body>
</html>
