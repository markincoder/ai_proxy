<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Новости — II Proxy</title>
    <link rel="stylesheet" href="/static/css/style.css?v=56" />
  </head>
  <body class="page-tariffs">
    <div id="site-banner-slot" aria-live="polite"></div>
    <script src="/static/js/site-banner.js?v=2" defer></script>
    <div id="site-header-root"></div>
    <script src="/static/js/site-header.js?v=6" defer></script>

    <main class="main-shell layout-wide page-news-main">
      <h1 class="page-title">Новости</h1>
      <p id="news-load-err" class="news-err" style="display: none"></p>
      <div id="news-list" class="news-list" aria-live="polite"></div>
    </main>

    <footer class="site-footer">II Proxy</footer>

    <script>
      function escapeHtml(s) {
        const d = document.createElement("div");
        d.textContent = s == null ? "" : String(s);
        return d.innerHTML;
      }

      function formatNewsDate(iso) {
        if (!iso) return "—";
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return escapeHtml(String(iso));
        return escapeHtml(
          d.toLocaleString("ru-RU", {
            dateStyle: "long",
            timeStyle: "short",
          })
        );
      }

      async function loadNews() {
        const list = document.getElementById("news-list");
        const errEl = document.getElementById("news-load-err");
        errEl.style.display = "none";
        errEl.textContent = "";
        let rows;
        try {
          const r = await fetch("/api/news", { credentials: "same-origin" });
          if (!r.ok) throw new Error(String(r.status));
          rows = await r.json();
        } catch {
          errEl.textContent = "Не удалось загрузить список новостей. Попробуйте обновить страницу.";
          errEl.style.display = "block";
          list.innerHTML = "";
          return;
        }
        if (!Array.isArray(rows) || !rows.length) {
          list.innerHTML = '<p class="news-empty">Пока нет опубликованных новостей.</p>';
          return;
        }
        list.innerHTML = rows
          .map((n) => {
            const img =
              n.imageUrl && String(n.imageUrl).trim()
                ? `<div class="news-card__media"><img class="news-card__img" src="${escapeHtml(
                    String(n.imageUrl).trim()
                  )}" alt="" loading="lazy" decoding="async" /></div>`
                : "";
            return `<article class="news-card">
              <p class="news-card__meta">${formatNewsDate(n.publishedAt)}</p>
              <h2 class="news-card__title">${escapeHtml(n.title || "")}</h2>
              ${img}
              <p class="news-card__body">${escapeHtml(n.body || "")}</p>
            </article>`;
          })
          .join("");
        try {
          if (rows[0].publishedAt) {
            localStorage.setItem("ii_proxy_news_last_seen_published_at", rows[0].publishedAt);
          }
        } catch {
          /* private mode */
        }
      }

      loadNews();
    </script>
    <script src="/static/js/app-nav.js?v=2" defer></script>
  </body>
</html>
